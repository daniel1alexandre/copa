<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copa Federações 2026 — Gerenciador Oficial de Beach Tennis</title>
  <meta name="description" content="Sistema completo de gerenciamento de torneios de Beach Tennis entre federações estaduais brasileiras. Chaveamento por eliminação simples com BYEs, chaves reversas, grafo de jogos e telão ao vivo.">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/bracket.css">
  <link rel="stylesheet" href="css/schedule.css">
  <link rel="stylesheet" href="css/telao.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Supabase: usa fetch() direto à REST API (sem SDK externo) -->
</head>
<body class="portal-open">

  <!-- BARRA DE TOPO DA COPA FEDERAÇÕES -->
  <header class="topbar">
    <div class="topbar-container">
      <div class="brand-section">
        <img src="assets/logo.jpg" alt="Logo Copa das Federações" class="main-logo" style="height: 42px; margin-right: 12px; border-radius: 6px; object-fit: contain;">
        <div class="brand-titles">
          <h1>
            Copa das Federações 2026
            <span class="brand-tag">Oficial CBT</span>
          </h1>
          <p>Campeonato Brasileiro de Beach Tennis</p>
        </div>
      </div>

      <div class="topbar-actions">
        <!-- Pílula de Sincronização Supabase Realtime -->
        <div id="topbar-sync-status"></div>

        <!-- Controle de Zoom da Aplicação -->
        <div class="zoom-controls-wrapper" title="Ajustar zoom das telas e letras">
          <button type="button" class="btn-zoom-step" id="btn-zoom-out" title="Diminuir visual (Zoom -)">A−</button>
          <span class="zoom-level-text" id="zoom-level-display">85%</span>
          <button type="button" class="btn-zoom-step" id="btn-zoom-in" title="Aumentar visual (Zoom +)">A+</button>
          <button type="button" class="btn-zoom-reset" id="btn-zoom-reset" title="Restaurar padrão (85%)">↺</button>
        </div>

        <button class="btn-topbar btn-topbar-ghost" onclick="window.switchTab('categorias')">
          🎾 Categorias
        </button>

        <button class="btn-topbar btn-topbar-ghost" onclick="window.switchTab('atletas')">
          👤 Atletas
        </button>

        <button class="btn-topbar btn-topbar-ghost" onclick="window.switchTab('chaveamento')">
          ⚔️ Confrontos
        </button>

        <button class="btn-topbar btn-topbar-ghost" style="background: rgba(255, 183, 3, 0.2); border-color: rgba(255, 183, 3, 0.4); color: #ffb703;" onclick="window.switchTab('ranking')">
          🏆 Ranking Geral
        </button>

        <!-- Sessão do Usuário (Baumann / Visitante) -->
        <div id="topbar-user-section"></div>
      </div>
    </div>
  </header>

  <!-- BARRA DE NAVEGAÇÃO PRINCIPAL -->
  <nav class="nav-bar">
    <div class="nav-container">
      <button class="nav-tab active" data-tab="home">
        🏠 Início / Painel
      </button>

      <button class="nav-tab" data-tab="categorias">
        🎾 Categorias
      </button>

      <button class="nav-tab" data-tab="atletas">
        👤 Atletas
      </button>

      <button class="nav-tab" data-tab="chaveamento">
        ⚔️ Confrontos
      </button>

      <button class="nav-tab" data-tab="ranking">
        🏆 Classificação & Ranking
      </button>

      <button class="nav-tab" data-tab="configuracoes">
        ⚙️ Configurações
      </button>
    </div>
  </nav>

  <!-- CONTAINER DE TELAS (VIEWS) -->
  <main class="main-content">
    <!-- VIEW 1: HOME / PAINEL -->
    <section id="view-home" class="app-view active"></section>

    <!-- VIEW 2: CATEGORIAS (NOVO) -->
    <section id="view-categorias" class="app-view"></section>

    <!-- VIEW 3: ATLETAS (NOVO) -->
    <section id="view-atletas" class="app-view"></section>

    <!-- VIEW 4: CHAVEAMENTO -->
    <section id="view-chaveamento" class="app-view"></section>

    <!-- VIEW 5: RANKING -->
    <section id="view-ranking" class="app-view"></section>

    <!-- VIEW 6: CONFIGURAÇÕES -->
    <section id="view-configuracoes" class="app-view"></section>
  </main>

  <!-- MODAL GLOBAL DE CONFRONTO E AGENDAMENTO -->
  <div id="match-modal-overlay" class="modal-overlay"></div>

  <!-- MODAL DE CONFIGURAÇÃO DE USUÁRIOS -->
  <div id="user-modal-overlay" class="modal-overlay"></div>

  <!-- CONTAINER PARA NOTIFICAÇÕES TOAST -->
  <div id="toast-container"></div>

  <!-- PORTAL INICIAL DE LOGIN OFICIAL CBT (ABRE SEMPRE QUE O ENDEREÇO É ACESSADO) -->
  <div id="cbt-login-portal" class="cbt-portal-overlay active">
    <div class="cbt-portal-backdrop"></div>
    <div class="cbt-portal-card">
      
      <!-- CABEÇALHO COM LOGO OFICIAL CBT -->
      <div class="portal-brand-header">
        <div class="portal-logo-wrapper">
          <img src="assets/logo.jpg" alt="Logo Oficial Confederação Brasileira de Tênis" class="portal-cbt-logo">
          <div class="portal-logo-glow"></div>
        </div>
        <div class="portal-titles">
          <span class="portal-confederacao">CONFEDERAÇÃO BRASILEIRA DE TÊNIS</span>
          <h2 class="portal-main-title">Copa das Federações 2026</h2>
          <span class="portal-sub-badge">🇧🇷 CAMPEONATO BRASILEIRO OFICIAL DE BEACH TENNIS</span>
        </div>
      </div>

      <!-- MENSAGEM DE ALERTA/ERRO -->
      <div id="portal-feedback" class="portal-feedback" style="display: none;"></div>

      <!-- FORMULÁRIO DE ACESSO -->
      <form id="cbt-login-form" class="portal-form" onsubmit="window.handlePortalLogin(event)">
        <div class="portal-form-group">
          <label for="portal-username" class="portal-label">
            <span class="label-icon">👤</span> Usuário Autorizado:
          </label>
          <div class="portal-input-wrapper">
            <input 
              type="text" 
              id="portal-username" 
              class="portal-input" 
              placeholder="Digite seu usuário" 
              value="" 
              autocomplete="off"
              required
            >
          </div>
        </div>

        <div class="portal-form-group">
          <label for="portal-password" class="portal-label">
            <span class="label-icon">🔒</span> Senha de Acesso:
          </label>
          <div class="portal-input-wrapper">
            <input 
              type="password" 
              id="portal-password" 
              class="portal-input" 
              placeholder="Digite a senha de administrador" 
              autocomplete="current-password"
              required
            >
            <button type="button" class="portal-pw-toggle" onclick="window.togglePortalPasswordVisibility()" title="Mostrar/Ocultar Senha">
              👁️
            </button>
          </div>
        </div>

        <div class="portal-options-row" style="justify-content: flex-end;">
          <span class="portal-security-badge">🛡️ Acesso Seguro CBT</span>
        </div>

        <button type="submit" id="portal-btn-submit" class="portal-btn-primary">
          <span class="btn-text">Entrar no Sistema Oficial</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <!-- DIVISOR -->
      <div class="portal-divider">
        <span>OU ACOMPANHE AS DISPUTAS</span>
      </div>

      <!-- BOTÃO VISITANTE / ESPECTADOR AO VIVO -->
      <button type="button" class="portal-btn-secondary" onclick="window.handlePortalGuestLogin()">
        <span class="secondary-icon">🎾</span>
        <div class="secondary-text">
          <strong>Acessar como Visitante / Espectador</strong>
          <small>Consultar confrontos, resultados e ranking em tempo real</small>
        </div>
        <span class="secondary-tag">AO VIVO</span>
      </button>

    </div>
  </div>

  <!-- SCRIPT PRINCIPAL MODULAR -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
